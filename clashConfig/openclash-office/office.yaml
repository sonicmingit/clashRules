# ============================================================
# OpenClash 公司网络统一配置
# 更新时间：2026-11-10
# ============================================================
# 本文件是自定义配置清单，不是 classical rule-provider 的 payload 文件。
# 需由配套覆写脚本读取，合并到 OpenClash 实际配置后才会生效。
# 与 direct.yaml、proxy.yaml 独立维护，不要直接作为订阅配置导入。
#
# 配套脚本应根据本文件生成：
# 1. 公司域名、网段优先分流规则。
# 2. 公司域名 nameserver-policy、Fake-IP 排除。
# 3. dnsmasq 的公司域名重绑定保护例外（保留全局保护）。
#
# DIRECT 指 OpenWrt 本机出口：Windows 虚拟机共享 → 单位网络。
# 宿主机 Wi-Fi / 办公网分流仍由宿主机路由或 Proxifier 决定。
# ============================================================

office:
  # ----------------------------------------------------------
  # 公司 DNS / 出口
  # DNS 是服务器地址，不是单位网络网关。
  # ----------------------------------------------------------
  dns: 10.93.10.1
  outbound: DIRECT

  # ----------------------------------------------------------
  # 公司域名后缀：覆盖根域名及所有子域名，无需填写 *.
  # 不带 https://、端口或路径；IP 变化时由公司 DNS 自动更新。
  # ----------------------------------------------------------
  domain_suffixes:
    - chinaunicom.cn
    - unicom.local
    # - example.corp

  # ----------------------------------------------------------
  # 公司 IP / 网段：适用于直接通过 IP 访问的系统。
  # /32 表示单个 IPv4 地址；有确认的网段后可用网段替换。
  # 不要直接加入 10.0.0.0/8，避免影响本机 LAN / ZeroTier。
  # ----------------------------------------------------------
  networks:
    - 10.236.0.221/32     # uac.sso.chinaunicom.cn
    - 10.172.145.169/32   # aiportal.chinaunicom.cn

  # ----------------------------------------------------------
  # 可选固定 hosts，默认不绑定，优先使用公司 DNS。
  # 如需固定，替换 {} 为下面示例的键值；地址变更需手动更新。
  # hosts:
  #   uac.sso.chinaunicom.cn: 10.236.0.221
  # ----------------------------------------------------------
  hosts: {}
